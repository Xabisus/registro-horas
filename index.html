<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de horas</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --blue:#03a9f4; --blue-d:#0288d1; --ink:#2b3a4a; --muted:#6b7a8a; --line:#e3e8ee;
    --bg:#f4f7fa; --card:#fff; --red:#e53935; --green:#2e9e5b;
    --series-1:#2a78d6; --none:#9aa7b4;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#fff}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--blue-d)}
  .hidden{display:none!important}

  /* ---------- nav ---------- */
  .nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:6px;padding:12px 5vw;background:#fff;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;color:var(--ink);cursor:pointer;margin-right:auto}
  .brand svg{width:28px;height:28px}
  .nav a.link{padding:8px 12px;color:var(--ink);text-decoration:none;font-size:15px;border-radius:6px;cursor:pointer}
  .nav a.link:hover{background:var(--bg)}
  .btn{border:0;border-radius:6px;padding:10px 18px;font-weight:600;letter-spacing:.3px;background:var(--blue);color:#fff}
  .btn:hover{background:var(--blue-d)}
  .btn.ghost{background:transparent;color:var(--blue-d);border:1px solid var(--blue)}
  .btn.ghost:hover{background:#e8f6fe}
  .btn.danger{background:var(--red)}
  .btn.sm{padding:7px 12px;font-size:14px}
  @media(max-width:700px){.nav a.link{display:none}}

  /* ---------- barra superior y acceso ---------- */
  .navuser{font-size:14px;color:var(--muted)}
  .sync{font-size:12px;color:var(--muted);min-width:80px;text-align:right}
  .sync.err{color:var(--red);font-weight:600}
  @media(max-width:640px){.navuser{display:none}}
  .auth{min-height:calc(100vh - 57px);display:grid;place-items:center;padding:24px 5vw;background:linear-gradient(180deg,#eaf7fe,#fff)}
  .auth .box{width:min(400px,100%);background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
  .auth h1{margin:0 0 4px;font-size:24px}
  .auth p{color:var(--muted);margin:0 0 16px;font-size:14px}
  .auth input{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px;background:#fff}
  .auth input:focus{outline:2px solid #b7e3fa;border-color:var(--blue)}
  .auth .btn{width:100%;margin-top:4px}
  .auth .alt{margin-top:14px;text-align:center;font-size:14px;color:var(--muted)}
  .auth .alt a{cursor:pointer}
  .auth .msg{font-size:13px;min-height:16px}
  .auth .msg.err{color:var(--red)} .auth .msg.ok{color:var(--green)}
  input[type=password],input[type=email]{border:1px solid var(--line);border-radius:6px;padding:9px 10px;background:#fff;min-width:0}
  .nonadmin .adm{display:none}
  .sect.lock{opacity:.85}

  /* ---------- app shell ---------- */
  .app{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 57px);background:var(--bg)}
  .side{background:#fff;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:57px;align-self:start;height:calc(100vh - 57px);overflow:auto}
  .ws{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:700}
  .ws img{width:32px;height:32px;border-radius:8px;object-fit:cover}
  .ws .dot{width:32px;height:32px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center}
  .ws span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:15px;color:var(--ink);text-decoration:none;cursor:pointer}
  .side a:hover{background:var(--bg)}
  .side a.on{background:#e8f6fe;color:var(--blue-d);font-weight:600}
  .side a i{font-style:normal;width:20px;text-align:center}
  .main{padding:26px 3vw 60px;width:100%;max-width:1100px}
  @media(max-width:820px){
    .app{grid-template-columns:1fr}
    .side{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
    .side .ws{display:none}.side a{white-space:nowrap;padding:8px 12px}
  }
  h1.title{font-size:26px;margin:0 0 6px}
  .status{font-size:13px;color:var(--muted);margin:0 0 16px}
  .status b{color:var(--ink)}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
  .toolbar .sp{flex:1}
  input[type=text],input[type=number],input[type=date],input[type=datetime-local],select,textarea{border:1px solid var(--line);border-radius:6px;padding:9px 10px;background:#fff;min-width:0}
  input:focus,select:focus,textarea:focus{outline:2px solid #b7e3fa;border-color:var(--blue)}
  .panel{background:#fff;border:1px solid var(--line);border-radius:10px}
  .tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:15px}
  .tbl th{background:#e9eff5;color:var(--muted);text-align:left;font-weight:600;font-size:13px;padding:10px 14px}
  .tbl td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
  .tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
  .tbl tr.arch td{color:#98a4b0}
  .tag-chip{display:inline-block;background:#eef2f6;border-radius:999px;padding:2px 9px;font-size:12px;color:var(--muted);margin-right:4px}
  .pdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:baseline}
  .ib{border:0;background:transparent;border-radius:6px;padding:6px 8px;font-size:17px;color:var(--muted)}
  .ib:hover{background:var(--bg);color:var(--ink)}
  .ib.del:hover{color:var(--red)}
  .empty{text-align:center;padding:50px 20px;color:var(--muted)}
  .empty .big{font-size:42px}
  .empty h3{margin:8px 0 4px;color:var(--ink)}
  .hint{font-size:13px;color:var(--muted);margin:10px 0}
  .note{background:#fff8e6;border:1px solid #f3e0a8;border-radius:8px;padding:10px 14px;font-size:14px;color:#6b5a1e;margin:10px 0}

  /* ---------- tracker ---------- */
  .bar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;flex-wrap:wrap}
  .bar input.nm{flex:1;min-width:170px;border:0;font-size:16px;padding:10px 4px;background:transparent}
  .bar input.nm:focus{outline:0}
  .bar select{max-width:170px}
  .tgl{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 11px;color:var(--muted);font-weight:600}
  .tgl.on{background:#e8f6fe;color:var(--blue-d);border-color:var(--blue)}
  .clock{font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;min-width:100px;text-align:right}
  .go{min-width:90px;padding:12px 20px;font-size:15px}
  .go.stop{background:var(--red)}
  .day{margin-top:22px}
  .day-h{display:flex;justify-content:space-between;align-items:center;background:#e9eff5;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:10px 14px;font-size:14px;color:var(--muted)}
  .day-h b{color:var(--ink)}
  .rows{border:1px solid var(--line);border-radius:0 0 10px 10px;background:#fff;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .row .t{flex:1;min-width:0;font-weight:600;cursor:text;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .t.done{color:var(--green)} .row .t.todo{color:var(--red)}
  .row input.edit{flex:1;padding:6px 8px;border:1px solid var(--blue);border-radius:6px}
  .row .pj{font-size:14px;color:var(--ink);white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}
  .row .range{color:var(--muted);font-size:14px;white-space:nowrap}
  .row .dur{font-variant-numeric:tabular-nums;font-weight:600;min-width:70px;text-align:right}
  .row .bill{color:var(--green);font-weight:700;width:14px}
  @media(max-width:640px){.row{flex-wrap:wrap}.row .range{order:9;width:100%}}

  /* ---------- calendar ---------- */
  .cal{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .cal-head,.cal-body{display:grid;grid-template-columns:48px repeat(7,1fr)}
  .cal-head div{padding:8px 4px;text-align:center;font-size:13px;color:var(--muted);border-left:1px solid var(--line);background:#e9eff5}
  .cal-head div b{display:block;color:var(--ink);font-size:15px}
  .cal-head div.today b{color:var(--blue-d)}
  .cal-scroll{max-height:560px;overflow:auto}
  .cal-body .gut{position:relative}
  .cal-body .gut span{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-50%)}
  .cal-col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 36px}
  .cal-col.off{background-color:#f7f9fb}
  .cal-col.today{background-color:#f2fafe}
  .blk{position:absolute;border-radius:5px;padding:2px 5px;font-size:11.5px;line-height:1.25;overflow:hidden;cursor:pointer;color:#0b2230;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 22%,#fff)}
  .blk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nowline{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:2}

  /* ---------- dashboard / reports ---------- */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:12px 0 18px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .tile small{color:var(--muted);font-size:13px}
  .tile div{font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
  .twocol{display:grid;grid-template-columns:3fr 2fr;gap:14px}
  @media(max-width:900px){.twocol{grid-template-columns:1fr}}
  .panel.pad{padding:16px}
  .panel h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;justify-content:space-between}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
  .seg button{border:0;background:transparent;padding:8px 14px;font-size:14px;color:var(--muted)}
  .seg button.on{background:#e8f6fe;color:var(--blue-d);font-weight:600}
  svg.chart{width:100%;height:auto;display:block}
  svg.chart text{font-size:11px;fill:var(--muted);font-family:inherit}
  .hb{display:grid;grid-template-columns:minmax(80px,140px) 1fr;gap:6px 12px;align-items:center;font-size:14px}
  .hb .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hb .trk{display:flex;align-items:center;gap:8px;height:20px}
  .hb .fill{height:14px;border-radius:0 4px 4px 0;min-width:2px}
  .hb .val{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  #tip{position:fixed;z-index:80;background:#2b3a4a;color:#fff;border-radius:6px;padding:6px 10px;font-size:12.5px;pointer-events:none;opacity:0;transition:opacity .08s;max-width:240px}

  /* ---------- forms / modal ---------- */
  .addrow{display:flex;gap:8px;flex-wrap:wrap}
  .ov{position:fixed;inset:0;background:rgba(20,30,40,.45);z-index:60;display:grid;place-items:center;padding:16px}
  .dlg{background:#fff;border-radius:12px;width:min(480px,100%);max-height:92vh;overflow:auto;padding:20px 22px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .dlg h3{margin:0 0 14px}
  .dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .form{display:grid;gap:12px}
  .fl{display:grid;gap:5px;font-size:14px}
  .fl>span{color:var(--muted);font-size:13px}
  .fl.inline{display:flex;align-items:center;gap:8px}
  .fl.inline>span{color:var(--ink);font-size:14px;order:2}
  .fl input[type=text],.fl input[type=number],.fl select,.fl textarea,.fl input[type=datetime-local]{width:100%}
  .mc{display:flex;flex-wrap:wrap;gap:8px}
  .mc label{display:flex;align-items:center;gap:5px;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
  .sw{display:flex;gap:8px;flex-wrap:wrap}
  .sw button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
  .sw button.on{box-shadow:0 0 0 2px var(--ink)}
  .err{color:var(--red);font-size:13px;min-height:16px;margin-top:8px}
  .sect{padding:18px 0;border-top:1px solid var(--line)}
  .sect:first-of-type{border-top:0}
  .sect h3{margin:0 0 4px;font-size:16px}
  .sect p{margin:0 0 10px;color:var(--muted);font-size:14px;max-width:680px}
  .days{display:flex;gap:6px;flex-wrap:wrap}
  .days label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;background:#fff}
  .logo-prev{width:64px;height:64px;border-radius:12px;object-fit:cover;border:1px solid var(--line);background:var(--bg)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b3a4a;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:90}
  .toast.show{opacity:1}
</style>
</head>
<body>

<header class="nav">
  <div class="brand" id="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#03a9f4"/><circle cx="16" cy="16" r="9.5" fill="#fff"/><path d="M16 9.5V16l4.5 3" stroke="#03a9f4" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Registro de horas
  </div>
  <span class="navuser hidden" id="navuser"></span>
  <span class="sync hidden" id="syncstatus"></span>
  <button class="btn ghost sm hidden" id="logout">Cerrar sesión</button>
</header>

<main id="view-auth" class="auth"></main>

<div id="view-app" class="app hidden">
  <aside class="side" id="side"></aside>
  <div class="main" id="content"></div>
</div>

<div id="tip"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(() => {
  /* =====================  helpers  ===================== */
  const $ = (s, r = document) => r.querySelector(s);
  const pad = n => String(n).padStart(2, '0');
  const uid = () => crypto.randomUUID();
  const DAY = 864e5, HOUR = 36e5;

  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    let val;
    for (const [k, v] of Object.entries(props || {})) {
      if (k === 'class') e.className = v;
      else if (k === 'style') e.style.cssText = v;
      else if (k === 'value') val = v;
      else if (k === 'checked') e.checked = !!v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (v === false || v == null) {}
      else e.setAttribute(k, v === true ? '' : v);
    }
    kids.flat(Infinity).forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
    if (val !== undefined) e.value = val;
    return e;
  }

  let toastT;
  const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); };
  const tipEl = $('#tip');
  const showTip = (e, lines) => {
    tipEl.textContent = '';
    [].concat(lines).forEach((l, i) => tipEl.append(i ? h('br') : '', i === 0 ? h('b', {}, l) : l));
    tipEl.style.opacity = 1;
    const x = e.clientX ?? (e.target.getBoundingClientRect().left + 10), y = e.clientY ?? (e.target.getBoundingClientRect().top);
    tipEl.style.left = Math.min(x + 12, innerWidth - 250) + 'px';
    tipEl.style.top = Math.max(8, y - 44) + 'px';
  };
  const hideTip = () => { tipEl.style.opacity = 0; };
  const hover = (el, lines) => {
    el.addEventListener('mousemove', e => showTip(e, lines));
    el.addEventListener('mouseleave', hideTip);
    el.addEventListener('focus', e => showTip(e, lines));
    el.addEventListener('blur', hideTip);
  };

  /* dates */
  const startOfDay = ts => new Date(ts).setHours(0, 0, 0, 0);
  const addDays = (ts, n) => { const d = new Date(ts); d.setDate(d.getDate() + n); return d.getTime(); };
  const dayKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const startOfWeek = ts => { const s = startOfDay(ts); const diff = (new Date(s).getDay() - S().weekStart + 7) % 7; return addDays(s, -diff); };
  const fmtTime = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const fmtDate = ts => new Date(ts).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
  const dayLabel = ts => {
    const k = dayKey(ts), now = Date.now();
    if (k === dayKey(now)) return 'Hoy';
    if (k === dayKey(addDays(now, -1))) return 'Ayer';
    return new Date(ts).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
  };
  const toLocalInput = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
  const dateInput = ts => dayKey(ts);
  const parseDateInput = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).getTime(); };

  /* durations (respect workspace format) */
  const clockFmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`; };
  function fmtD(ms) {
    const f = S().durFmt;
    if (f === 'compact') { const m = Math.round(ms / 60000); return `${Math.floor(m / 60)}:${pad(m % 60)}`; }
    if (f === 'decimal') return (ms / HOUR).toFixed(2).replace('.', ',');
    return clockFmt(Math.round(ms / 1000) * 1000);
  }

  /* =====================  state  ===================== */
  const PALETTE = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'];
  const defaults = () => ({
    tasks: [], running: null,
    projects: [], clients: [], tags: [],
    members: [], invites: [],
    settings: { workspace: 'Equipo', logo: null, durFmt: 'full', workDays: [1, 2, 3, 4, 5], weekStart: 1, defBillable: false, requireProject: false }
  });
  let state = defaults();
  const S = () => state.settings;
  const pById = id => state.projects.find(p => p.id === id);
  const cById = id => state.clients.find(c => c.id === id);
  const tById = id => state.tags.find(t => t.id === id);
  const pColor = id => (pById(id) || {}).color || 'var(--none)';
  const pName = id => (pById(id) || {}).name || 'Sin proyecto';

  let ticker = null, route = 'tracker';
  let draft = { projectId: '', tagIds: [], billable: false };
  let sb = null, me = null;
  const CFG = window.APP_CONFIG || {};
  const isAdmin = () => !!me && me.role === 'admin';
  const myTasks = () => state.tasks.filter(t => t.userId === me.id);
  const uName = id => { const m = state.members.find(x => x.id === id); return m ? m.name : 'Persona eliminada'; };

  /* ---------- datos compartidos (Supabase) ----------
     El estado vive en memoria (state). persist() compara con lo último guardado
     y sube solo las filas que han cambiado, así dos personas no se pisan. */
  const COLS = [
    { key: 'clients', table: 'clients',
      to: c => ({ id: c.id, name: c.name, address: c.address || '', archived: !!c.archived }),
      from: r => ({ id: r.id, name: r.name, address: r.address || '', archived: !!r.archived }) },
    { key: 'projects', table: 'projects',
      to: p => ({ id: p.id, name: p.name, client_id: p.clientId || null, color: p.color, billable: !!p.billable, archived: !!p.archived }),
      from: r => ({ id: r.id, name: r.name, clientId: r.client_id || '', color: r.color, billable: !!r.billable, archived: !!r.archived }) },
    { key: 'tags', table: 'tags',
      to: t => ({ id: t.id, name: t.name, archived: !!t.archived }),
      from: r => ({ id: r.id, name: r.name, archived: !!r.archived }) },
    { key: 'tasks', table: 'time_entries', own: true,
      to: t => ({ id: t.id, user_id: t.userId, text: t.text, done: !!t.status, start_at: new Date(t.start).toISOString(), end_at: new Date(t.end).toISOString(), project_id: t.projectId || null, tag_ids: t.tagIds || [], billable: !!t.billable }),
      from: r => ({ id: r.id, userId: r.user_id, text: r.text, status: !!r.done, start: Date.parse(r.start_at), end: Date.parse(r.end_at), projectId: r.project_id || '', tagIds: r.tag_ids || [], billable: !!r.billable }) }
  ];
  let synced = {}, syncedSettings = '', syncedRunning = 'null';
  const rowsOf = c => new Map(state[c.key].filter(x => !c.own || isAdmin() || x.userId === me.id).map(x => [x.id, JSON.stringify(c.to(x))]));
  function snapshot() {
    synced = {}; COLS.forEach(c => { synced[c.key] = rowsOf(c); });
    syncedSettings = JSON.stringify(state.settings); syncedRunning = JSON.stringify(state.running);
  }
  const chunks = (a, n) => { const o = []; for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i + n)); return o; };
  const must = r => { if (r && r.error) throw r.error; return r; };

  let flushTimer = null, chain = Promise.resolve(), dirty = false, saving = false, syncErr = false;
  function setSync(kind) {
    const el = $('#syncstatus'); if (!el) return;
    el.className = 'sync' + (kind === 'error' ? ' err' : '');
    el.textContent = kind === 'saving' ? 'Guardando…' : kind === 'error' ? '⚠ Sin guardar' : '✓ Guardado';
  }
  function persist() {
    dirty = true; setSync('saving');
    clearTimeout(flushTimer);
    flushTimer = setTimeout(() => { chain = chain.then(flush); }, 300);
  }
  async function flush() {
    if (!dirty) return;
    dirty = false; saving = true;
    try {
      for (const c of COLS) {                       // primero lo nuevo/cambiado (clientes → proyectos → etiquetas → horas)
        const cur = rowsOf(c), old = synced[c.key];
        const up = [...cur].filter(([id, j]) => old.get(id) !== j);
        for (const ch of chunks(up, 300)) { must(await sb.from(c.table).upsert(ch.map(([, j]) => JSON.parse(j)))); ch.forEach(([id, j]) => old.set(id, j)); }
      }
      for (const c of [...COLS].reverse()) {        // después lo borrado
        const have = new Set(state[c.key].map(x => x.id)), old = synced[c.key];
        const gone = [...old.keys()].filter(id => !have.has(id));
        for (const ch of chunks(gone, 100)) { must(await sb.from(c.table).delete().in('id', ch)); ch.forEach(id => old.delete(id)); }
      }
      const sj = JSON.stringify(state.settings);
      if (isAdmin() && sj !== syncedSettings) { must(await sb.from('workspace_settings').upsert({ id: 1, data: state.settings })); syncedSettings = sj; }
      const rj = JSON.stringify(state.running);
      if (rj !== syncedRunning) {
        must(state.running ? await sb.from('running_timers').upsert({ user_id: me.id, data: state.running }) : await sb.from('running_timers').delete().eq('user_id', me.id));
        syncedRunning = rj;
      }
      saving = false; syncErr = false;
      if (!dirty) setSync('ok');
    } catch (e) {
      saving = false; dirty = true; setSync('error');
      if (!syncErr) toast('No se pudo guardar (' + ((e && e.message) || 'error') + '). Lo reintento en unos segundos.');
      syncErr = true;
      clearTimeout(flushTimer); flushTimer = setTimeout(() => { chain = chain.then(flush); }, 10000);
    }
  }
  const flushNow = () => { clearTimeout(flushTimer); chain = chain.then(flush); return chain; };

  async function fetchAll(table, order = 'id') {
    const out = []; let from = 0;
    for (;;) {                                      // Supabase devuelve máx. 1000 filas por petición
      const { data, error } = await sb.from(table).select('*').order(order).range(from, from + 999);
      if (error) throw error;
      out.push(...data);
      if (data.length < 1000) return out;
      from += 1000;
    }
  }
  async function loadAll() {
    const [profiles, clients, projects, tags, tasks] = await Promise.all(['profiles', 'clients', 'projects', 'tags', 'time_entries'].map(t => fetchAll(t)));
    const [st, run, inv] = await Promise.all([
      sb.from('workspace_settings').select('*').eq('id', 1).maybeSingle(),
      sb.from('running_timers').select('*').eq('user_id', me.id).maybeSingle(),
      isAdmin() ? fetchAll('allowed_emails', 'email') : Promise.resolve([])
    ]);
    must(st); must(run);
    const d = defaults();
    state = Object.assign(d, {
      members: profiles.map(p => ({ id: p.id, name: p.name || p.email, email: p.email, role: p.role, active: !!p.active })),
      invites: inv.map(i => ({ email: i.email, role: i.role })),
      clients: clients.map(COLS[0].from), projects: projects.map(COLS[1].from), tags: tags.map(COLS[2].from), tasks: tasks.map(COLS[3].from),
      running: run.data ? run.data.data : null,
      settings: Object.assign(d.settings, st.data ? st.data.data : {})
    });
    me = state.members.find(m => m.id === me.id) || me;
    snapshot();
  }
  function syncDraft() { draft = state.running ? { projectId: state.running.projectId || '', tagIds: state.running.tagIds || [], billable: !!state.running.billable } : { projectId: '', tagIds: [], billable: S().defBillable }; }

  /* refresco: cada minuto y al volver a la pestaña, para ver las horas de los demás */
  async function refresh() {
    if (!me || document.hidden || dirty || saving || document.querySelector('.ov')) return;
    const a = document.activeElement;
    if (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && $('#content').contains(a)) return;
    try {
      await loadAll();
      if (!me.active) return location.reload();
      if (state.running) syncDraft();
      render();
    } catch (e) { /* sin conexión: se reintenta en el siguiente ciclo */ }
  }
  setInterval(refresh, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  window.addEventListener('beforeunload', e => { if (dirty || saving) { e.preventDefault(); e.returnValue = ''; } });

  /* ---------- acceso (login) ---------- */
  function setAuthed(on) {
    $('#view-auth').classList.toggle('hidden', on);
    $('#view-app').classList.toggle('hidden', !on);
    ['navuser', 'syncstatus', 'logout'].forEach(id => $('#' + id).classList.toggle('hidden', !on));
  }
  function authFail(e) {
    const m = (e && e.message) || String(e);
    if (/invalid login/i.test(m)) return 'Correo o contraseña incorrectos.';
    if (/not confirmed/i.test(m)) return 'Confirma tu correo: te hemos enviado un enlace.';
    if (/database error|autorizado/i.test(m)) return 'Este correo no está autorizado. Pide al administrador que te invite.';
    if (/already registered/i.test(m)) return 'Ese correo ya tiene cuenta. Entra con tu contraseña.';
    if (/rate limit/i.test(m)) return 'Demasiados intentos. Espera unos minutos.';
    return m;
  }
  function showAuth(mode = 'login', note = '') {
    setAuthed(false);
    const root = $('#view-auth'); root.textContent = '';
    if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY || !window.supabase) {
      root.append(h('div', { class: 'box' }, h('h1', {}, 'Falta configurar'), h('p', {}, 'Rellena SUPABASE_URL y SUPABASE_ANON_KEY en config.js (mira el README).')));
      return;
    }
    const msg = h('div', { class: 'msg' });
    const say = (t, ok) => { msg.textContent = t || ''; msg.className = 'msg ' + (ok ? 'ok' : 'err'); };
    if (note) say(note);
    const name = h('input', { type: 'text', placeholder: 'Tu nombre', autocomplete: 'name', maxlength: 60 });
    const email = h('input', { type: 'email', placeholder: 'Correo', autocomplete: 'email' });
    const pass = h('input', { type: 'password', placeholder: mode === 'recovery' ? 'Nueva contraseña' : 'Contraseña', autocomplete: mode === 'login' ? 'current-password' : 'new-password' });
    const T = { login: ['Entrar', 'Accede con tu cuenta del equipo.'], signup: ['Crear cuenta', 'Usa el correo con el que te invitó el administrador.'], reset: ['Recuperar contraseña', 'Te enviaremos un enlace por correo.'], recovery: ['Nueva contraseña', 'Elige una contraseña nueva (mínimo 8 caracteres).'] }[mode];
    const btn = h('button', { class: 'btn', type: 'submit' }, mode === 'login' ? 'Entrar' : mode === 'signup' ? 'Crear cuenta' : mode === 'reset' ? 'Enviar enlace' : 'Guardar contraseña');
    const fields = { login: [email, pass], signup: [name, email, pass], reset: [email], recovery: [pass] }[mode];
    const frm = h('form', { class: 'form', onsubmit: async ev => {
      ev.preventDefault(); btn.disabled = true; say('');
      try {
        const em = email.value.trim().toLowerCase();
        if (mode === 'login') {
          const { data, error } = await sb.auth.signInWithPassword({ email: em, password: pass.value }); if (error) throw error;
          await enter(data.user);
        } else if (mode === 'signup') {
          if (!name.value.trim()) throw new Error('Escribe tu nombre.');
          if (pass.value.length < 8) throw new Error('La contraseña debe tener al menos 8 caracteres.');
          const { data, error } = await sb.auth.signUp({ email: em, password: pass.value, options: { data: { name: name.value.trim() } } }); if (error) throw error;
          if (data.session) await enter(data.user); else say('Cuenta creada. Revisa tu correo para confirmarla y después entra.', true);
        } else if (mode === 'reset') {
          const { error } = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + location.pathname }); if (error) throw error;
          say('Si el correo tiene cuenta, recibirás un enlace.', true);
        } else {
          if (pass.value.length < 8) throw new Error('La contraseña debe tener al menos 8 caracteres.');
          const { error } = await sb.auth.updateUser({ password: pass.value }); if (error) throw error;
          const { data } = await sb.auth.getSession(); await enter(data.session.user);
        }
      } catch (e) { say(authFail(e)); }
      btn.disabled = false;
    } }, ...fields, btn, msg);
    const link = (label, m) => h('a', { href: '#', onclick: e => { e.preventDefault(); showAuth(m); } }, label);
    const alt = mode === 'login' ? [link('Crear cuenta', 'signup'), ' · ', link('He olvidado la contraseña', 'reset')] : mode === 'recovery' ? [] : [link('Volver a entrar', 'login')];
    root.append(h('div', { class: 'box' }, h('h1', {}, T[0]), h('p', {}, T[1]), frm, h('div', { class: 'alt' }, alt)));
    (fields[0]).focus();
  }
  function showBlocked(prof) {
    setAuthed(false);
    const root = $('#view-auth'); root.textContent = '';
    root.append(h('div', { class: 'box' }, h('h1', {}, prof ? 'Cuenta desactivada' : 'Cuenta sin acceso'),
      h('p', {}, prof ? 'Un administrador ha desactivado tu acceso.' : 'Tu cuenta no tiene perfil en el equipo. Pide al administrador que te invite.'),
      h('button', { class: 'btn', onclick: logout }, 'Cerrar sesión')));
  }
  async function logout() {
    try { await flushNow(); } catch (e) {}
    try { await sb.auth.signOut(); } catch (e) {}
    location.hash = ''; location.reload();
  }
  async function enter(user) {
    const { data: prof, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    if (error) return showAuth('login', 'No se pudo cargar tu perfil: ' + error.message);
    if (!prof || !prof.active) return showBlocked(prof);
    me = { id: prof.id, name: prof.name || prof.email, email: prof.email, role: prof.role, active: true };
    setAuthed(true); setSync('ok');
    $('#content').textContent = 'Cargando…';
    try { await loadAll(); } catch (e) { $('#content').textContent = 'No se pudieron cargar los datos: ' + ((e && e.message) || e) + '. Recarga la página.'; return; }
    $('#navuser').textContent = me.name + (isAdmin() ? ' · admin' : '');
    syncDraft();
    go();
  }
  async function boot() {
    if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY || !window.supabase) return showAuth('login');
    sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
    let recovery = false;
    sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') { recovery = true; showAuth('recovery'); } });
    const { data } = await sb.auth.getSession();
    if (recovery) return;
    if (data.session) await enter(data.session.user); else showAuth('login');
  }

  /* =====================  UI building blocks  ===================== */
  function modal({ title, body, buttons }) {
    const close = () => { ov.remove(); document.removeEventListener('keydown', esc); };
    const esc = e => { if (e.key === 'Escape') close(); };
    const err = h('div', { class: 'err' });
    const ov = h('div', { class: 'ov', onmousedown: e => { if (e.target === ov) close(); } },
      h('div', { class: 'dlg', role: 'dialog', 'aria-label': title },
        h('h3', {}, title), body, err,
        h('div', { class: 'acts' }, buttons.map(b => h('button', { class: 'btn sm ' + (b.kind || ''), onclick: () => b.onClick(close, m => { err.textContent = m || ''; }) }, b.label)))));
    document.body.append(ov);
    document.addEventListener('keydown', esc);
    const f = ov.querySelector('input[type=text],input[type=number],select,textarea'); if (f) f.focus();
    return close;
  }
  const confirmBox = (title, msg, yesLabel, onYes) => modal({
    title, body: h('p', { style: 'margin:0;color:var(--muted)' }, msg),

  });

  /* generic form: fields -> {root, get()} */
  function form(fields) {
    const getters = {}, root = h('div', { class: 'form' });
    fields.forEach(f => {
      let el;
      if (f.type === 'text' || f.type === 'number') el = h('input', { type: f.type, value: f.value ?? '', maxlength: f.max, placeholder: f.placeholder, step: f.step, min: f.min }), getters[f.key] = () => f.type === 'number' ? Number(el.value || 0) : el.value.trim();
      else if (f.type === 'textarea') el = h('textarea', { rows: 2, value: f.value ?? '' }), getters[f.key] = () => el.value.trim();
      else if (f.type === 'datetime') el = h('input', { type: 'datetime-local', step: 1, value: toLocalInput(f.value) }), getters[f.key] = () => new Date(el.value).getTime();
      else if (f.type === 'select') el = h('select', { value: f.value ?? '' }, f.options.map(o => h('option', { value: o.value }, o.label))), getters[f.key] = () => el.value;
      else if (f.type === 'checkbox') el = h('input', { type: 'checkbox', checked: f.value }), getters[f.key] = () => el.checked;
      else if (f.type === 'multicheck') {
        const boxes = f.options.map(o => ({ o, i: h('input', { type: 'checkbox', checked: (f.value || []).includes(o.value) }) }));
        el = f.options.length ? h('div', { class: 'mc' }, boxes.map(b => h('label', {}, b.i, b.o.label))) : h('div', { class: 'hint', style: 'margin:0' }, f.empty || 'Nada que elegir todavía.');
        getters[f.key] = () => boxes.filter(b => b.i.checked).map(b => b.o.value);
      } else if (f.type === 'color') {
        let cur = f.value || PALETTE[0];
        const btns = PALETTE.map(c => h('button', { type: 'button', class: c === cur ? 'on' : '', style: 'background:' + c, 'aria-label': c, onclick: () => { cur = c; btns.forEach((b, i) => b.classList.toggle('on', PALETTE[i] === c)); } }));
        el = h('div', { class: 'sw' }, btns); getters[f.key] = () => cur;
      }
      root.append(h('label', { class: 'fl' + (f.type === 'checkbox' ? ' inline' : '') }, h('span', {}, f.label), el));
    });
    return { root, get: () => Object.fromEntries(Object.entries(getters).map(([k, g]) => [k, g()])) };
  }
  const projectOptions = (withNone = true, includeId) => [].concat(withNone ? [{ value: '', label: 'Sin proyecto' }] : [],
    state.projects.filter(p => !p.archived || p.id === includeId).map(p => ({ value: p.id, label: p.name })));

  /* entry editor (edit or add manually) */
  function entryDialog(task) {

  /* =====================  timer  ===================== */

  function toggleTimer() {

  /* ---------- Time tracker ---------- */
  function tagsLabel() { return draft.tagIds.length ? `🏷 ${draft.tagIds.length}` : '🏷'; }
  function trackerView() {

    const name = h('input', { class: 'nm', id: 'name', type: 'text', maxlength: 120, placeholder: '¿En qué estás trabajando?', autocomplete: 'off', value: state.running ? state.running.name || '' : draft.name || '',

      h('button', { class: 'btn ghost sm', onclick: () => entryDialog(null) }, '+ Añadir tiempo manualmente')));

  /* ---------- Importar desde Clockify (CSV del informe Detailed) ---------- */
  function parseCsv(txt) {
    if (txt.charCodeAt(0) === 0xFEFF) txt = txt.slice(1);
    const first = txt.split(/\r?\n/)[0] || '';
    const delim = [',', ';', '\t'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
    const rows = []; let row = [], f = '', q = false;
    for (let i = 0; i < txt.length; i++) {
      const c = txt[i];
      if (q) { if (c === '"') { if (txt[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === delim) { row.push(f); f = ''; }
      else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
      else if (c !== '\r') f += c;
    }
    if (f !== '' || row.length) { row.push(f); rows.push(row); }
    return rows;
  }
  function parseDT(d, t, fmt) {
    const dp = String(d || '').trim().split(/[\/\-.]/).map(x => parseInt(x, 10));
    const tm = String(t || '').trim().match(/(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])?/);
    if (dp.length < 3 || dp.some(isNaN) || !tm) return NaN;
    let [a, b, c] = dp, y, m, day;
    if (fmt === 'ymd') [y, m, day] = [a, b, c]; else if (fmt === 'mdy') [m, day, y] = [a, b, c]; else [day, m, y] = [a, b, c];
    if (y < 100) y += 2000;
    let hh = +tm[1]; const ap = (tm[4] || '').toLowerCase();
    if (ap === 'pm' && hh < 12) hh += 12; if (ap === 'am' && hh === 12) hh = 0;
    const ts = new Date(y, m - 1, day, hh, +tm[2], +(tm[3] || 0)).getTime();
    return isFinite(ts) && m >= 1 && m <= 12 ? ts : NaN;
  }
  function detectFmt(vals) {
    let dmy = false, mdy = false;
    for (const v of vals) {
      const p = String(v).trim().split(/[\/\-.]/);
      if (p[0] && p[0].length === 4) return 'ymd';
      if (+p[0] > 12) dmy = true; if (+p[1] > 12) mdy = true;
    }
    return dmy && !mdy ? 'dmy' : mdy && !dmy ? 'mdy' : null;
  }

      tags: g(r, 'tags').split(',').map(x => x.trim()).filter(Boolean), billable: /^(yes|true|1|si|sí)$/i.test(g(r, 'billable')),
      sd: g(r, 'start date'), st: g(r, 'start time'), ed: g(r, 'end date'), et: g(r, 'end time')

      { label: 'Cancelar', kind: 'ghost', onClick: c => c() },
      { label: 'Importar', onClick: (c, err) => {
        const { fresh } = build(); if (!fresh.length) return err('No hay nada nuevo que importar.');
        const cl = n => { if (!n) return ''; let o = state.clients.find(x => x.name.toLowerCase() === n.toLowerCase()); if (!o) state.clients.push(o = { id: uid(), name: n, address: '', archived: false }); return o.id; };
        const pr = (n, clientName, bill) => { if (!n) return ''; let o = state.projects.find(x => x.name.toLowerCase() === n.toLowerCase()); if (!o) state.projects.push(o = { id: uid(), name: n, clientId: cl(clientName), color: PALETTE[state.projects.length % PALETTE.length], billable: bill, archived: false }); return o.id; };
        const tg = n => { let o = state.tags.find(x => x.name.toLowerCase() === n.toLowerCase()); if (!o) state.tags.push(o = { id: uid(), name: n, archived: false }); return o.id; };
        fresh.forEach(r => {
          const tags = r.tags.map(tg); if (tagUsers.checked && r.user) tags.push(tg('👤 ' + r.user));
          state.tasks.push({ id: uid(), userId: me.id, text: r.text || 'Tarea', status: false, start: r.a, end: r.b, projectId: pr(r.project, r.client, r.billable), tagIds: [...new Set(tags)], billable: r.billable });
        });
        persist(); c(); location.hash = 'tracker'; render(); toast(fresh.length + ' entradas importadas');
      } }] });
  }

  const VIEWS = { tracker: trackerView, calendar: calendarView, dashboard: dashboardView, reports: reportsView, projects: projectsView, team: teamView, clients: clientsView, tags: tagsView, workspace: settingsView };

  /* =====================  routing  ===================== */
  function go() {
    if (!me) return;
    const hash = location.hash.slice(1);
    route = VIEWS[hash] ? hash : 'tracker';
    hideTip(); window.scrollTo(0, 0);
    render();
  }
  $('#brand').addEventListener('click', () => { if (me) location.hash = 'tracker'; });
  $('#logout').addEventListener('click', logout);
  window.addEventListener('hashchange', go);
  boot();
})();
</script>
</body>
</html>
